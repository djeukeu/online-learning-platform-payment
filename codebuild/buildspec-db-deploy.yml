version: 0.2

phases:
    install:
        runtime-versions:
            nodejs: 22
        commands:
            - npm install --global yarn@1.22.22
            - yarn install --frozen-lockfile
    build:
        commands:
            - export DATABASE_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
            - yarn prisma:deploy
